<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empregado</title>
</head>
<body>
    <H1>Cadastro de Empregado</H1>

    <form action = "processar.php"method = "GET">

        <br><br>

        <br><br>
